<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>链接数据表</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    margin: 0; padding: 20px 16px; color: #222; background: #f5f6f8;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .meta { color: #888; font-size: 13px; margin-bottom: 16px; }
  .table-wrap { overflow-x: auto; background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 13px; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid #eee; white-space: nowrap; }
  th { background: #f0f2f5; font-weight: 600; position: sticky; top: 0; }
  tbody tr:hover { background: #fafbfc; }
  .cat-feiliao { color: #c8842a; }
  .cat-qita { color: #3a7ca5; }
  .yes { color: #2e8b57; font-weight: 600; }
  .no { color: #c0392b; font-weight: 600; }
  td.link a { color: #2b6cb0; text-decoration: none; max-width: 240px; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: bottom; }
  td.link a:hover { text-decoration: underline; }
  .err { color: #c0392b; padding: 20px; }
  @media (prefers-color-scheme: dark) {
    body { background: #15171a; color: #e6e6e6; }
    .table-wrap { background: #1e2125; box-shadow: none; }
    th { background: #262a2f; }
    th, td { border-bottom-color: #2c2f34; }
    tbody tr:hover { background: #23272c; }
  }
</style>
</head>
<body>
  <h1>链接数据表</h1>
  <div class="meta" id="meta">加载中…</div>
  <div class="table-wrap">
    <table id="tbl">
      <thead>
        <tr><th>奖励</th><th>奖励名</th><th>每日次数</th><th>deliveryId</th><th>sceneId</th><th>链接</th><th>是否使用</th></tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>

<script>
const SOURCES = [
  "/links.csv",
  "https://cdn.jsdelivr.net/gh/doctorstrange1122/huafei@main/data/links.csv",
  "https://raw.githubusercontent.com/doctorstrange1122/huafei/main/data/links.csv"
];

function parseCSV(text) {
  const lines = text.replace(/\r/g, "").split("\n").filter(l => l.length);
  const out = [];
  for (let i = 1; i < lines.length; i++) {
    const row = lines[i].split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
    out.push(row.map(c => c.replace(/^"|"$/g, "").trim()));
  }
  return out;
}

function render(rows) {
  const body = document.getElementById("body");
  body.innerHTML = "";
  let feiliao = 0, qita = 0;
  rows.forEach(r => {
    const [cat, name, daily, did, sid, link, used] = r;
    const tr = document.createElement("tr");
    const catClass = cat === "肥料" ? "cat-feiliao" : "cat-qita";
    const usedClass = used === "是" ? "yes" : "no";
    const linkHtml = link ? `<a href="${link}" target="_blank" rel="noopener">${link}</a>` : "";
    tr.innerHTML = `<td class="${catClass}">${cat||""}</td><td>${name||""}</td><td>${daily||""}</td><td>${did||""}</td><td>${sid||""}</td><td class="link">${linkHtml}</td><td class="${usedClass}">${used||""}</td>`;
    body.appendChild(tr);
    if (cat === "肥料") feiliao++; else qita++;
  });
  document.getElementById("meta").textContent =
    `共 ${rows.length} 条 · 肥料区 ${feiliao} · 其他区 ${qita} · 更新时间 ${new Date().toLocaleString("zh-CN")}`;
}

async function load() {
  for (const url of SOURCES) {
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) continue;
      const text = await res.text();
      const rows = parseCSV(text);
      if (rows.length) { render(rows); return; }
    } catch (e) { /* try next */ }
  }
  document.getElementById("meta").innerHTML = '<span class="err">数据加载失败，请稍后重试。</span>';
}

load();
</script>
</body>
</html>
