            tip.textContent = '解析完成，未生成二维码。可直接使用该ID，或点击功能区按钮生成奖励链接。';
            wrap.appendChild(tip);
            resultArea.innerHTML = '';
            resultArea.appendChild(wrap);
        }

        async function generateQRCodes(quantity, baseUrl, autoLabel, btnKey, skipCount) {
            // 获取用户输入的淘口令/分享文本和自定义文字
            const productLink = document.getElementById('productLink').value.trim();
            const userCustomText = document.getElementById('customText').value.trim();

            // 检查输入是否为空
            if (!productLink) {
                alert('请先输入淘口令或分享文本');
                return;
            }

            const resultArea = document.getElementById('resultArea');
            scrollResultIntoView();
            resultArea.innerHTML = '<p class="loading-hint"><span class="spinner"></span>正在解析淘口令并生成，请稍候...</p>';

            // 解析商品ID（直接id / 淘口令解析 / 链接提取，支持多id）——抽取为共享函数供自定义链接复用
            const parseStart = Date.now();
            const productId = await resolveProductId(productLink);
            // 若解析过快（如直接输入商品id），保证“正在解析”至少可见约 500ms，避免一闪而过让用户以为没反应
            const elapsed = Date.now() - parseStart;
            if (elapsed < 500) {
                await new Promise(function(r) { setTimeout(r, 500 - elapsed); });
            }

            if (!productId) {
                resultArea.innerHTML = '<p style="color: var(--error-text);">解析失败：无法获取商品ID</p><p style="font-size:12px;color:#999;">可能原因：① 网络不稳定，代理请求失败；② 输入的不是有效的淘口令或商品链接；③ 淘宝短链已失效。请检查网络后重试。</p>';
                return;
            }

            try {
                // === 中转重定向模式（默认占位，未配置时自动回退到直出真实链接）===
                // 二维码只编码“你的中转域名/令牌”，真实淘宝链接由中转服务按 btnKey 映射，
                // 返回轻量 HTML 中转页；页面内用 tbopen:// 官方 Deep Link 唤起淘宝 App。
                // 扫码看不到完整 URL；改链接只需改中转服务配置，无需改本文件、也无需重打包 APK。
                const REDIRECT_BASE = 'https://huafei-redirect-pages.pages.dev'; // ← 中转服务域名（Pages Functions 自动从在线文档同步按钮链接，国内访问稳定）
                const REDIRECT_ORIGIN = REDIRECT_BASE.replace(/\/+$/, '');
                // 结果区跳转 / 兜底始终用真实完整链接（本机直接唤起 App，不依赖中转页）
                const directUrl = replaceIdInUrl(baseUrl, productId);
                let fullContent;
                if (btnKey && REDIRECT_BASE.indexOf('YOUR-WORKER') === -1) {
                    // 中转模式：把商品id 作为 pid 传给中转服务，由服务端拼回真实链接并返回中转页
                    // 自定义链接（self_ 开头）走 huafei-redirect-pages 的 /h/ 中转（GET 跳转，WebView 内可用）
                    // 后端已统一迁移至 huafei-redirect-pages，与文档同域闭环
                    let redirectOrigin = REDIRECT_ORIGIN;
                    let pathPrefix = '/r/';
                    if (btnKey.indexOf('self_') === 0) {
                        redirectOrigin = 'https://huafei-redirect-pages.pages.dev';
                        pathPrefix = '/h/';
                    }
                    fullContent = redirectOrigin + pathPrefix + encodeURIComponent(btnKey) + '?pid=' + encodeURIComponent(productId);
                } else {
                    // 兜底：直接编码真实淘宝链接（未配置中转服务时）
                    fullContent = directUrl;
                }
                // 生成二维码（中转模式下二维码内容为你的中转地址，不含任何淘宝参数）
                const qrCodeDataURL = await QRCode.toDataURL(fullContent, {
                    width: 256,
                    height: 256,
                    errorCorrectionLevel: 'M',
                    colorDark: "#000000",
                    colorLight: "#FFFFFF"
                });

                // 保存生成的链接与商品ID供后续使用
                window._lastGeneratedLink = fullContent;
                window._lastGeneratedProductId = productId;

                // 增加按钮使用次数（自定义链接 key 不计入统计，无角标；skipCount=true 同样不计数）
                if (btnKey && !skipCount && btnKey.indexOf('self_') !== 0) {
                    incrementUsageCount(btnKey);
                }

                // 同步使用次数到悬浮窗
                syncUsageToFloat();

                // 拼接二维码上方文字：自定义文字 + 两个空格 + 自动标签
                let displayText = autoLabel || '';
                if (userCustomText) {
                    displayText = userCustomText + '  ' + (autoLabel || '');
                }

                // 创建一个用于显示结果的容器
                const container = document.createElement('div');
                container.className = 'qr-code-container';

                // 长按保存提示
                const saveTip = document.createElement('div');
                saveTip.className = 'long-press-tip';
                saveTip.textContent = '点击放大，长按保存';

                // 创建操作按钮区域
                const actionButtons = document.createElement('div');
                actionButtons.className = 'action-buttons';

                // 始终创建带文字的二维码（至少包含自动标签）
                currentQRCodeWithTextCanvas = await createQRCodeWithText(qrCodeDataURL, displayText);

                const mergedImg = document.createElement('img');
                mergedImg.className = 'qr-thumb';
                mergedImg.src = currentQRCodeWithTextCanvas.toDataURL('image/png');
                mergedImg.alt = '带文字图片';
                mergedImg.style.webkitTouchCallout = 'none';

                // 点击放大预览（用高清原图）
                mergedImg.addEventListener('click', function() {
                    openQRPreview(currentQRCodeWithTextCanvas.toDataURL('image/png'));
                });

                // 长按保存：APK 用原生保存到图库，浏览器弹出系统菜单（含"保存图片"选项）
                mergedImg.addEventListener('contextmenu', function(e) {
                    if (isInApp) {
                        e.preventDefault();
                    }
                });
                let longPressTimer;
                mergedImg.addEventListener('touchstart', function(e) {
                    longPressTimer = setTimeout(function() {
                        if (isInApp && NativeBridge.saveImage) {
                            if (confirm('是否保存图片到图库？')) {
                                NativeBridge.saveImage(currentQRCodeWithTextCanvas.toDataURL('image/png'));
                            }
                        }
                    }, 600);
                });
                mergedImg.addEventListener('touchend', function() { clearTimeout(longPressTimer); });
                mergedImg.addEventListener('touchmove', function() { clearTimeout(longPressTimer); });

                // 左侧：二维码 + 长按提示
                const qrLeft = document.createElement('div');
                qrLeft.className = 'qr-code-left';
                qrLeft.style.textAlign = 'center';
                qrLeft.appendChild(mergedImg);
                qrLeft.appendChild(saveTip);

                // 右侧：操作区
                const qrRight = document.createElement('div');
                qrRight.className = 'qr-code-right';

                const escapedProductId = String(window._lastGeneratedProductId || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                // 按逗号拆分为独立片段：单id内部不换行，多id之间自动换行
                const productIdHtml = escapedProductId.split(',').map(function(s) {
                    return '<span class="pid-item">' + s.trim() + '</span>';
                }).join('');
                actionButtons.innerHTML = `
                    <div class="product-id-panel">
                        <span class="pid-label">当前商品id</span>
                        <span class="pid-value">${productIdHtml}</span>
                        <div class="pid-btn-group">
                            <button type="button" class="copy-id-btn" onclick="copyProductId()">复制</button>
                            <button type="button" class="add-common-btn" onclick="addCurrentToCommonIds()" title="保存到常用 id">+常用</button>
                        </div>
                    </div>
                    <button class="btn-taobao" onclick="openTaobaoApp('${directUrl}')">一键跳转淘宝</button>
                    <button class="btn-tmall" onclick="openTmallApp('${directUrl}')">一键跳转天猫</button>
                `;

                qrRight.appendChild(actionButtons);

                container.appendChild(qrLeft);
                container.appendChild(qrRight);

                // 更新结果区域（商品id 改为显示在右侧操作区面板中）
                resultArea.innerHTML = '';
                resultArea.appendChild(container);

                // 注：结果卡片的显示与滚动已在函数开头（写入“正在解析”提示时）完成，
                // 此处无需重复操作，避免重复声明与二次滚动抖动。

                // 自动跳转：根据复选框选择跳转对应APP（结果区始终用真实链接直跳）
                // fromAutoJump=true：iOS 下必然弹手势遮罩兜底，避免 setTimeout 落在手势
                // 新鲜度窗口内时 Safari 拦截 scheme 而无任何提示
                if (getAutoJumpEnabled()) {
                    setTimeout(function() { openTaobaoApp(directUrl, '', true); }, 300);
                } else if (getAutoJumpTmallEnabled()) {
                    setTimeout(function() { openTmallApp(directUrl, true); }, 300);
                }
            } catch (error) {
                console.error('生成失败:', error);
                resultArea.innerHTML = '<p style="color: var(--error-text);">生成过程中出现错误，请检查控制台。</p>';
            }
        }
    </script>

        .key-activate-card h2 {
            font-size: 20px;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        .key-activate-card .subtitle {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 20px;
        }
        .key-activate-card input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            margin-bottom: 14px;
            background: var(--input-bg);
            color: var(--text-main);
            outline: none;
            text-align: center;
            letter-spacing: 1px;
            font-family: "SF Mono", Menlo, monospace;
            text-transform: uppercase;
            transition: border-color 0.2s;
        }
        .key-activate-card input:focus { border-color: #6b82a0; }
        .key-activate-card button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #7a93ac, #6b82a0);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .key-activate-card button:active { transform: scale(0.98); }
        .key-activate-card button:disabled { opacity: 0.6; cursor: not-allowed; }
        .key-activate-error {
            color: var(--error-text);
            font-size: 13px;
            margin-top: 10px;
            min-height: 18px;
        }
        .key-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
    </style>

    <div id="keyActivateOverlay">
        <div class="key-activate-card">
            <div class="key-icon">🔐</div>
            <h2>请输入激活密钥</h2>
            <p class="subtitle">本工具需要激活密钥才能使用<br>每密钥仅限一台设备</p>
            <input type="text" id="keyInput" placeholder="DT-XXXX-XXXX-XXXX" autocomplete="off" maxlength="20">
            <button id="keyActivateBtn" onclick="activateKey()">激 活</button>
            <div class="key-activate-error" id="keyError"></div>
        </div>
    </div>

    <script>
    // 密钥验证系统
    (function() {
        const KEY_API_BASE = 'https://huafei-redirect-pages.pages.dev/api/key';
        const STORAGE_KEY = 'app_activate_key';
        const STORAGE_DEVICE = 'app_device_id';
        // 密钥当前是否有效（页面加载验证成功 / 激活成功后置 true；点击生成/解析时只读取此标志，零网络开销）
        window.__keyValid = false;

        // 获取或生成设备ID
        function getDeviceId() {
            let id = localStorage.getItem(STORAGE_DEVICE);
            if (!id) {
                id = 'dev_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                localStorage.setItem(STORAGE_DEVICE, id);
            }
            return id;
        }

        // 显示激活弹窗
        function showActivateOverlay() {
            document.getElementById('keyActivateOverlay').classList.add('active');
            // 自动聚焦
            setTimeout(() => {
                const input = document.getElementById('keyInput');
                if (input) input.focus();
            }, 300);
        }

        // 隐藏激活弹窗
        function hideActivateOverlay() {
            document.getElementById('keyActivateOverlay').classList.remove('active');
        }

        // 函数级密钥闸门：生成二维码/解析前调用，未验证则弹出激活窗并返回 false（不阻挡已验证用户，零网络开销）
        function ensureKeyValid() {
            if (window.__keyValid === true) return true;
            showActivateOverlay();
            return false;
        }

        // 验证已保存的密钥
        async function verifySavedKey() {
            const savedKey = localStorage.getItem(STORAGE_KEY);
            const deviceId = getDeviceId();

            if (!savedKey) return false;

            // 本地存有已激活密钥：信任本地状态（服务端校验改为后台非阻塞软校验，
            // 不再因服务端拒认已激活设备而把已激活用户锁死）。只有从未激活（本地无密钥）的设备才被拦。
            // 后台仍请求一次 /verify 用于统计/未来可撤销，但不阻塞使用。
            try {
                fetch(KEY_API_BASE + '/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: savedKey, deviceId })
                }).catch(function() {});
            } catch (e) {}
            return true;
        }

        // 全局激活函数
        window.activateKey = async function() {
            const keyInput = document.getElementById('keyInput');
            const btn = document.getElementById('keyActivateBtn');
            const errEl = document.getElementById('keyError');

            let key = (keyInput.value || '').trim().toUpperCase();
            if (!key) {
                errEl.textContent = '请输入密钥';
                return;
            }

            btn.disabled = true;
            btn.textContent = '激活中...';
            errEl.textContent = '';

            const deviceId = getDeviceId();

            try {
                const resp = await fetch(KEY_API_BASE + '/activate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key, deviceId })
                });
                const data = await resp.json();

                if (data.success && data.activated) {
                    localStorage.setItem(STORAGE_KEY, key);
                    localStorage.setItem('app_last_verify', Date.now());
                    window.__keyValid = true;
                    hideActivateOverlay();
                } else {
                    errEl.textContent = data.error || '激活失败';
                }
            } catch (e) {
                errEl.textContent = '网络错误，请检查网络后重试';
            } finally {
                btn.disabled = false;
                btn.textContent = '激 活';
            }
        };

        // 回车激活
        document.addEventListener('DOMContentLoaded', function() {
            const keyInput = document.getElementById('keyInput');
            if (keyInput) {
                keyInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') activateKey();
                });
            }
        });

        // 初始化：检查激活状态
        async function init() {
            const isValid = await verifySavedKey();
            if (isValid) {
                localStorage.setItem('app_last_verify', Date.now());
                window.__keyValid = true;
                hideActivateOverlay();
            } else {
                showActivateOverlay();
            }
        }

        // 页面加载后立即检查
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>

    <!-- 二维码点击放大预览 -->
    <div class="qr-lightbox" id="qrLightbox" onclick="closeQRPreview(event)">
        <img id="qrLightboxImg" src="" alt="二维码原图" />
    </div>
</body>
</html>
